<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101820">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<title>سیگنال BTCUSDT</title>
<style>
  :root{--bg:#101820;--panel:#17232e;--line:#2a3b4a;--text:#e8eef3;--muted:#8ea1b1;--buy:#00914b;--sell:#be232d;--accent:#e0a526}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--text);font-family:Tahoma,"Vazirmatn",system-ui,sans-serif;line-height:1.7;max-width:640px;margin-inline:auto;
    padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
  h1{font-size:18px;margin:6px 0 12px}
  section{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
  h2{font-size:15px;margin:0 0 10px;color:var(--accent)}
  .price{font-size:clamp(28px,9vw,40px);font-weight:700;direction:ltr;text-align:right;font-variant-numeric:tabular-nums}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .grid .full{grid-column:1/-1}
  button,select{font:inherit;color:#fff;background:#2b4054;border:0;border-radius:10px;padding:12px 14px;min-height:46px;cursor:pointer;touch-action:manipulation}
  button:active{filter:brightness(1.25)}
  button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  button.buy{background:var(--buy)} button.sell{background:var(--sell)}
  input{width:100%;font:inherit;font-size:16px;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px;margin-bottom:8px;direction:ltr;min-height:46px}
  label{font-size:13px;color:var(--muted)}
  .status{font-size:13px;color:var(--muted);margin:6px 0 0}
  .ok{color:#3fb97c} .bad{color:#e5636b}
  .chip{display:inline-block;padding:2px 10px;border-radius:999px;font-weight:700;color:#fff}
  .chip.BUY{background:var(--buy)} .chip.SELL{background:var(--sell)}
  #log{max-height:220px;overflow:auto;font-size:12px;direction:ltr;text-align:left;color:var(--muted)}
  #log div{padding:2px 0;border-bottom:1px solid var(--line)}
</style>
</head>
<body>
<h1>سیگنال BTCUSDT Futures (BOS + ADX)</h1>

<section>
  <h2>قیمت و تایم‌فریم</h2>
  <div class="price" id="price">—</div>
  <div class="row">
    <select id="tf" aria-label="تایم‌فریم">
      <option value="1m">1 دقیقه</option>
      <option value="5m" selected>5 دقیقه</option>
      <option value="15m">15 دقیقه</option>
      <option value="1d">1 روز</option>
    </select>
    <span class="status" id="state">در حال اتصال…</span>
  </div>
  <p class="status" id="last">آخرین سیگنال: —</p>
</section>

<section>
  <h2>نوتیفیکیشن و صدا</h2>
  <div class="grid">
    <button id="btnPerm" class="full">فعال‌سازی نوتیفیکیشن</button>
    <button class="buy" id="btnBuy">تست BUY</button>
    <button class="sell" id="btnSell">تست SELL</button>
  </div>
  <p class="status" id="permStatus"></p>
  <p class="status">برای اعلان واقعی در موبایل صفحه باید باز باشد. در پس‌زمینه فقط تلگرام مطمئن است. در آیفون ابتدا «Add to Home Screen» بزنید.</p>
</section>

<section>
  <h2>تلگرام</h2>
  <label for="tok">توکن ربات</label>
  <input id="tok" type="password" autocomplete="off" autocapitalize="off" spellcheck="false">
  <label for="chat">Chat ID</label>
  <input id="chat" inputmode="numeric" autocomplete="off" autocapitalize="off" spellcheck="false">
  <button id="btnTg" style="width:100%">پیام تست</button>
  <p class="status" id="tgStatus"></p>
</section>

<section>
  <h2>گزارش</h2>
  <div id="log"></div>
</section>

<script>
// ===== پارامترها =====
const P = {
  pivotLen: 2, atrLen: 2, adxLen: 14, adxSmooth: 14, minADX: 20,
  bodyATR: 0.30, spacing: 3, structureLife: 100, useADX: true
};
const TFMS = { '1m': 6e4, '5m': 3e5, '15m': 9e5, '1d': 864e5 };

const $ = id => document.getElementById(id);
const log = (m, c) => { const d = document.createElement('div'); d.textContent = new Date().toLocaleTimeString() + '  ' + m; if (c) d.className = c; $('log').prepend(d); while ($('log').children.length > 80) $('log').lastChild.remove(); };
try { $('tok').value = localStorage.getItem('tg_tok') || ''; $('chat').value = localStorage.getItem('tg_chat') || ''; } catch (e) {}
const saveTg = () => { try { localStorage.setItem('tg_tok', $('tok').value.trim()); localStorage.setItem('tg_chat', $('chat').value.trim()); } catch (e) {} };
$('tok').onchange = $('chat').onchange = saveTg;

// ===== محاسبهٔ سیگنال‌ها روی کندل‌های بسته‌شده =====
function computeSignals(k) {
  const n = k.length, sigs = [];
  let atr = 0, rTR = 0, rP = 0, rM = 0, adx = 0, plusDI = 0, minusDI = 0;
  let lastPH = null, lastPL = null, prevSBH = null, prevSBL = null;
  let lastDir = 0, lastBar = null;
  const hi = (i, a, b) => { let m = -Infinity; for (let j = i - a; j <= i - b; j++) m = Math.max(m, k[j].h); return m; };
  const lo = (i, a, b) => { let m = Infinity; for (let j = i - a; j <= i - b; j++) m = Math.min(m, k[j].l); return m; };

  for (let i = 0; i < n; i++) {
    const c = k[i], p = k[i - 1];
    const tr = i ? Math.max(c.h - c.l, Math.abs(c.h - p.c), Math.abs(c.l - p.c)) : c.h - c.l;
    atr = i ? (atr * (P.atrLen - 1) + tr) / P.atrLen : tr;

    // DMI / ADX
    const up = i ? c.h - p.h : 0, dn = i ? p.l - c.l : 0;
    const pdm = up > dn && up > 0 ? up : 0, mdm = dn > up && dn > 0 ? dn : 0;
    const L = P.adxLen;
    rTR = i ? (rTR * (L - 1) + tr) / L : tr;
    rP = i ? (rP * (L - 1) + pdm) / L : 0;
    rM = i ? (rM * (L - 1) + mdm) / L : 0;
    plusDI = rTR ? 100 * rP / rTR : 0; minusDI = rTR ? 100 * rM / rTR : 0;
    const dx = (plusDI + minusDI) ? 100 * Math.abs(plusDI - minusDI) / (plusDI + minusDI) : 0;
    adx = i ? (adx * (P.adxSmooth - 1) + dx) / P.adxSmooth : dx;

    // پیوت‌ها (تأیید با تأخیر pivotLen کندل)
    const q = P.pivotLen;
    if (i >= 2 * q) {
      const m = i - q; let isH = true, isL = true;
      for (let j = m - q; j <= m + q; j++) { if (j === m) continue; if (k[j].h >= k[m].h) isH = false; if (k[j].l <= k[m].l) isL = false; }
      if (isH) lastPH = { v: k[m].h, bar: m };
      if (isL) lastPL = { v: k[m].l, bar: m };
    }
    const SBH = lastPH && i - lastPH.bar < P.structureLife ? lastPH.v : null;
    const SBL = lastPL && i - lastPL.bar < P.structureLife ? lastPL.v : null;

    if (i >= 4) {
      const body = Math.abs(c.c - c.o), minBody = atr * P.bodyATR;
      const bull = c.c > c.o, bear = c.c < c.o;

      const x3 = hi(i, 3, 1), x3p = hi(i - 1, 3, 1);
      const y3 = lo(i, 3, 1), y3p = lo(i - 1, 3, 1);
      const x2 = hi(i, 2, 1), x2p = hi(i - 1, 2, 1);
      const y2 = lo(i, 2, 1), y2p = lo(i - 1, 2, 1);

      const confUp = c.c > x3 && p.c <= x3p && bull && body >= minBody;
      const confDn = c.c < y3 && p.c >= y3p && bear && body >= minBody;
      const strUp = SBH !== null && prevSBH !== null && c.c > SBH && p.c <= prevSBH && bull && body >= minBody;
      const strDn = SBL !== null && prevSBL !== null && c.c < SBL && p.c >= prevSBL && bear && body >= minBody;
      const qUp = c.c > x2 && p.c <= x2p && bull;
      const qDn = c.c < y2 && p.c >= y2p && bear;

      const adxOK = !P.useADX || adx >= P.minADX;
      const buyOK = adxOK && (!P.useADX || plusDI > minusDI);
      const sellOK = adxOK && (!P.useADX || minusDI > plusDI);
      const spacingOK = lastBar === null || i - lastBar >= P.spacing;

      const buy = (confUp || strUp || qUp) && buyOK && lastDir !== 1 && spacingOK;
      const sell = (confDn || strDn || qDn) && sellOK && lastDir !== -1 && spacingOK;
      if (buy || sell) {
        lastDir = buy ? 1 : -1; lastBar = i;
        sigs.push({ type: buy ? 'BUY' : 'SELL', time: c.t, price: c.c });
      }
    }
    prevSBH = SBH; prevSBL = SBL;
  }
  return sigs;
}

// ===== دریافت داده (درخواست موازی با تأخیر کم به چند هاست، سریع‌ترین جواب برنده است) =====
const HOSTS = ['https://fapi.binance.com', 'https://fapi1.binance.com', 'https://fapi2.binance.com', 'https://fapi3.binance.com'];
let goodHost = HOSTS[0], useSpot = false;
const SPOT = 'https://data-api.binance.vision';   // جایگزین وقتی Futures در شبکه/VPN مسدود است (مثلاً خطای 451)
function bf(path) {
  if (useSpot) path = path.replace('/fapi/v1/', '/api/v3/');
  const order = useSpot ? [SPOT] : [goodHost, ...HOSTS.filter(h => h !== goodHost)];
  return new Promise((resolve, reject) => {
    let done = false, fails = 0, lastErr = '';
    const acs = [];
    order.forEach((h, i) => setTimeout(async () => {
      if (done) return;
      const ac = new AbortController(); acs.push(ac);
      const t = setTimeout(() => ac.abort(), 6000);
      try {
        const r = await fetch(h + path, { signal: ac.signal, cache: 'no-store' });
        const j = await r.json();
        if (!r.ok) throw new Error(j.msg || r.status);
        if (!done) { done = true; if (!useSpot) goodHost = h; acs.forEach(a => a !== ac && a.abort()); resolve(j); }
      } catch (e) { lastErr = h + ' → ' + e.message; if (++fails === order.length && !done) reject(new Error(lastErr)); }
      finally { clearTimeout(t); }
    }, i * 1000));
  });
}

// ===== صدا، لرزش و نوتیفیکیشن =====
let actx = null;
function unlockAudio() { try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state !== 'running') actx.resume(); } catch (e) {} }
['touchstart', 'click'].forEach(ev => document.addEventListener(ev, unlockAudio, { passive: true }));
function beep(f) {
  try {
    unlockAudio(); const ctx = actx; if (!ctx) return;
    [0, .25].forEach(t => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = f; o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(.25, ctx.currentTime + t);
      g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + t + .2);
      o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + .2);
    });
  } catch (e) {}
  try { navigator.vibrate && navigator.vibrate([200, 100, 200, 100, 400]); } catch (e) {}
}

// اندروید کروم «new Notification» را پشتیبانی نمی‌کند؛ باید از Service Worker استفاده شود
let swReg = null;
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').then(r => { swReg = r; }).catch(e => log('Service Worker ثبت نشد (نیاز به https یا localhost و فایل sw.js): ' + e.message, 'bad'));

async function pushNotif(title, body) {
  try {
    if (!('Notification' in window) || Notification.permission !== 'granted') return;
    const reg = swReg || (navigator.serviceWorker && await navigator.serviceWorker.getRegistration());
    if (reg && reg.showNotification) {
      await reg.showNotification(title, { body, tag: 'btc-' + Date.now(), vibrate: [200, 100, 200, 100, 400], requireInteraction: true });
    } else new Notification(title, { body });
  } catch (e) { log('خطای نوتیفیکیشن: ' + e.message, 'bad'); }
}

function showPerm() {
  if (!('Notification' in window)) { $('permStatus').textContent = 'این مرورگر نوتیفیکیشن ندارد (در آیفون صفحه را به Home Screen اضافه کنید).'; return; }
  const p = Notification.permission;
  $('permStatus').textContent = p === 'granted' ? 'مجوز داده شده است.' : p === 'denied' ? 'مجوز مسدود است (از تنظیمات مرورگر باز کنید).' : 'هنوز مجوز داده نشده است.';
  $('permStatus').className = 'status ' + (p === 'granted' ? 'ok' : p === 'denied' ? 'bad' : '');
}
showPerm();
$('btnPerm').onclick = async () => { unlockAudio(); if ('Notification' in window) await Notification.requestPermission(); showPerm(); };

async function tg(text) {
  const tok = $('tok').value.trim(), chat = $('chat').value.trim();
  if (!tok || !chat) return false;
  saveTg();
  for (let a = 0; a < 2; a++) {
    try {
      const r = await fetch('https://api.telegram.org/bot' + encodeURIComponent(tok) + '/sendMessage', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ chat_id: chat, text }), keepalive: true
      });
      const j = await r.json();
      if (j.ok) return true;
      log('خطای تلگرام: ' + j.description, 'bad'); return false;
    } catch (e) { if (a) log('خطای شبکه تلگرام: ' + e.message, 'bad'); }
  }
  return false;
}

function notify(type, price, tf, note) {
  const title = 'BTCUSDT ' + type + ' (' + tf + ')', body = 'قیمت: ' + price + (note ? '\n' + note : '');
  tg((type === 'BUY' ? '🟢 ' : '🔴 ') + title + '\n' + body);   // اول تلگرام، بدون منتظر ماندن
  pushNotif(title, body);
  beep(type === 'BUY' ? 880 : 440);
  log('سیگنال ' + type + ' @ ' + price + (note ? ' — ' + note : ''), 'ok');
}

$('btnBuy').onclick = () => notify('BUY', $('price').textContent, 'تست');
$('btnSell').onclick = () => notify('SELL', $('price').textContent, 'تست');
$('btnTg').onclick = async () => {
  const ok = await tg('✅ تست BTCUSDT\nقیمت: ' + $('price').textContent);
  $('tgStatus').textContent = ok ? 'ارسال شد.' : 'ارسال نشد (گزارش را ببین).';
  $('tgStatus').className = 'status ' + (ok ? 'ok' : 'bad');
};

// ===== حلقهٔ اصلی: کندل‌ها محلی نگه داشته می‌شوند و با وب‌سوکت در لحظهٔ بسته‌شدن بلافاصله بررسی می‌شوند =====
let K = [], skew = 0, lastNotified = null, curTF = $('tf').value, busy = false;
const fmt = v => Number(v).toLocaleString('en-US', { minimumFractionDigits: 2 });
const setState = (t, ok) => { $('state').textContent = t; $('state').className = 'status ' + (ok ? 'ok' : 'bad'); };
const toCandle = x => ({ t: x[0], o: +x[1], h: +x[2], l: +x[3], c: +x[4] });

$('tf').onchange = () => { curTF = $('tf').value; lastNotified = null; K = []; init(); connectWS(); };

function evaluate() {
  const tf = curTF, ms = TFMS[tf], sigs = computeSignals(K), last = sigs[sigs.length - 1];
  if (!last) return;
  $('last').innerHTML = 'آخرین سیگنال: <span class="chip ' + last.type + '">' + last.type + '</span> ' + new Date(last.time + ms).toLocaleString() + ' — ' + last.price.toLocaleString('en-US');
  if (lastNotified === null) {
    lastNotified = last.time;
    tg('✅ ربات BTCUSDT Futures فعال شد (' + tf + ')\nآخرین سیگنال: ' + last.type + ' @ ' + last.price.toLocaleString('en-US') + '\nاز این به بعد هر BUY/SELL جدید را اینجا می‌فرستم.');
    return;
  }
  sigs.filter(s => s.time > lastNotified).forEach(s => {
    lastNotified = s.time;
    const delay = Math.round((Date.now() + skew - (s.time + ms)) / 1000);
    notify(s.type, s.price.toLocaleString('en-US'), tf, delay > 5 ? 'تأخیر: ' + delay + ' ثانیه بعد از بسته‌شدن کندل' : '');
  });
}

async function init() {
  if (busy) return; busy = true;
  const tf = curTF;
  try {
    const [a, t] = await Promise.all([bf('/fapi/v1/klines?symbol=BTCUSDT&interval=' + tf + '&limit=500'), bf('/fapi/v1/time')]);
    if (tf === curTF) {
      skew = t.serverTime - Date.now();                        // اصلاح ساعت اشتباه گوشی
      const now = Date.now() + skew;
      K = a.filter(x => x[6] < now).map(toCandle);
      if (a.length) $('price').textContent = fmt(a[a.length - 1][4]);
      setState('متصل — ' + (useSpot ? 'Spot' : 'Futures'), true);
      evaluate();
    }
  } catch (e) {
    setState('خطا: ' + e.message, false); log('خطا: ' + e.message, 'bad');
    if (!useSpot) { useSpot = true; log('Futures در دسترس نیست؛ رفتن به Spot', 'bad'); setTimeout(() => { init(); connectWS(); }, 0); }
  }
  finally { busy = false; if (tf !== curTF) init(); }
}

function onClosed(k) {
  const c = { t: k.t, o: +k.o, h: +k.h, l: +k.l, c: +k.c }, L = K[K.length - 1];
  if (!L) return;
  if (c.t === L.t) K[K.length - 1] = c;
  else if (c.t < L.t) return;
  else if (c.t - L.t > TFMS[curTF]) { init(); return; }       // کندلی جا افتاده → همگام‌سازی کامل
  else K.push(c);
  if (K.length > 500) K.shift();
  evaluate();
}

let ws = null, wsGen = 0, lastMsg = 0;
function connectWS() {
  const gen = ++wsGen;
  if (ws) { ws.onclose = null; ws.onmessage = null; try { ws.close(); } catch (e) {} }
  try { ws = new WebSocket((useSpot ? 'wss://data-stream.binance.vision' : 'wss://fstream.binance.com') + '/ws/btcusdt@kline_' + curTF); } catch (e) { setTimeout(connectWS, 3000); return; }
  ws.onopen = () => { lastMsg = Date.now(); log('وب‌سوکت وصل شد', 'ok'); };
  ws.onmessage = e => {
    lastMsg = Date.now();
    const m = JSON.parse(e.data); if (!m.k) return;
    if (m.E) skew = m.E - Date.now();
    $('price').textContent = fmt(m.k.c);
    if (m.k.x && m.k.i === curTF) onClosed(m.k);
  };
  ws.onclose = () => { if (gen === wsGen) { log('وب‌سوکت قطع شد، اتصال دوباره…', 'bad'); setTimeout(connectWS, 1500); } };
}
// موبایل اغلب وب‌سوکت را بی‌صدا قطع می‌کند؛ اگر ۱۵ ثانیه چیزی نیامد دوباره وصل می‌شویم
setInterval(() => { if (document.visibilityState === 'visible' && Date.now() - lastMsg > 15000) connectWS(); }, 5000);
// شبکهٔ اطمینان: همگام‌سازی کامل با REST
let pollN = 0;
setInterval(() => {
  if (document.visibilityState !== 'visible') return;
  pollN++;
  if (Date.now() - lastMsg > 15000 || pollN % 4 === 0) init();   // اگر وب‌سوکت مرده، هر ۵ ثانیه؛ وگرنه هر ۲۰ ثانیه
}, 5000);

// اگر وب‌سوکت قیمت نداد (فیلتر/قطعی)، قیمت از REST گرفته می‌شود
setInterval(async () => {
  if (document.visibilityState !== 'visible' || Date.now() - lastMsg < 8000) return;
  try { const r = await bf('/fapi/v1/ticker/price?symbol=BTCUSDT'); $('price').textContent = fmt(r.price); } catch (e) {}
}, 3000);

init(); connectWS();

// ===== روشن ماندن صفحه =====
let wl = null;
async function keepAwake() {
  try {
    if ('wakeLock' in navigator && !wl) {
      wl = await navigator.wakeLock.request('screen');
      wl.addEventListener('release', () => { wl = null; });
      log('صفحه روشن می‌ماند', 'ok');
    }
  } catch (e) {}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') { keepAwake(); connectWS(); init(); }   // برگشت از پس‌زمینه: فوراً جبران سیگنال‌های از دست‌رفته
});
document.addEventListener('click', keepAwake, { once: true });
document.addEventListener('touchstart', keepAwake, { once: true, passive: true });
window.addEventListener('online', () => { connectWS(); init(); });
</script>
</body>
</html>
